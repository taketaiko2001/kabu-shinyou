# 場中の1時間ごとの確認（仮想売買）。Claude は使わず、tools/auto.py が決めたルールどおりに
# 約定・損切り・利確・スイングの新しい買いを処理して、作業用の記録（data/trade）をコミットする。ページへの反映は 9:00・12:30・15:30 の更新で行う。
# 株探は GitHub Actions からは接続を断られるため、株探を使う M1（朝の窓下げ買い）と P1 は Claude の更新（8:40・12:30）で動かす。
name: hourly
on:
  schedule:
    - cron: "7 1,2 * * 1-5"   # 10:07・11:07
    - cron: "37 4,5 * * 1-5"  # 13:37・14:37
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trade
jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q -r tools/requirements.txt
      - run: python tools/auto.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "仮想売買の確認 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 1

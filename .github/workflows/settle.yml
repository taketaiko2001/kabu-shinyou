# 大引け後の精算の予備。15:30 の更新（Claude）が大引けの決済を反映できなかったときだけ、
# tools/trade.py settle が約定・損切り・デイトレードの引け決済を処理してページにも反映する。Claude は使わない。休場日は何もしない。
name: settle
on:
  schedule:
    - cron: "40 7 * * 1-5"     # 平日16:40（日本時間）。GitHubの混雑で数十分遅れることがある
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trade
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q -r tools/requirements.txt
      - run: python tools/trade.py settle
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade docs/data/portfolio.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "仮想売買を精算 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 1

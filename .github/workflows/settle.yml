# 仮想売買の大引け後の精算（約定待ちの注文・損切り・デイトレードの引け決済を、その日のうちに反映する）。
# Claude は使わず、tools/trade.py settle を動かして portfolio.json をコミットするだけ。休場日は何もしない。
name: settle
on:
  schedule:
    - cron: "0 7 * * 1-5"     # 平日16:00（日本時間）。GitHubの混雑で数十分遅れることがある
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: settle
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r tools/requirements.txt
      - run: python tools/trade.py settle
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/portfolio.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "仮想売買を精算 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 1
